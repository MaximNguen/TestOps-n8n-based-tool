services:
  engine:
    build:
      context: .
      args:
        INSTALL_NEWMAN: ${INSTALL_NEWMAN:-false}
    container_name: custom-n8n-engine
    ports:
      - "5678:5678"
    environment:
      WORKFLOW_SECRET: ${WORKFLOW_SECRET:-change-me-in-production}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTMAN_BIN: ${POSTMAN_BIN:-postman}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: custom-n8n-n8n
    ports:
      - "5679:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  n8n_data:
